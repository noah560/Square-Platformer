<html>
    <body>
        <h1 id="l">0</h1>
        <canvas id="c" width="400" height="400"></canvas>
        <script>
let keys = [];
const c = document.getElementById("c").getContext("2d");
let map;
function genMap() {
    map = new Array(50*10).fill(0);
    let y = 0;
    for (let x = 0; x < 50; 0) {
        const l = x == 0 ? 6 : Math.floor(Math.random()*2) + 3;
        for (let i = 0; i < l && i+x < 50; i++) {
            map[(x+i)*10+y] = 1;
        }
        x += l + 2;
        y = Math.min(9, Math.max(0, y + Math.floor(Math.random()*4) - 1));
    }
}
genMap();
document.addEventListener("keydown", e => {
    keys.push(e.key);
});
document.addEventListener("keyup", e => {
    keys = keys.filter(x => x !== e.key);
});
let playerX = 1, playerY = -2, playerVy = 0;
function raycast(angle) {
    for (let i = 1; i < 1000; i++) {
        const z = Math.cos(angle)*0.03*i;
        const fx = playerX + z;
        const x = Math.floor(fx);
        const fy = playerY + Math.sin(angle)*0.03*i - 0.5;
        const y = Math.floor(fy);
        if (map[10 * x + y] && fy > 0.05) return [400 / z, Math.abs(Math.round(fx)-fx) < 0.1];
        if (x < 0 || x > 49 || fy < -4.95 || fy > 9.95) break;
    }
    return [0, false];
}
function collide() {
    return map[10 * Math.floor(playerX) + Math.floor(playerY)] && playerY > 0.05 && playerY < 9.95;
}
setInterval(() => {
    c.fillStyle = "#3366ff";
    c.fillRect(0, 0, 400, 400);

    playerX += 0.12;
    playerVy += 0.01;
    playerY += playerVy;

    if (collide()) {
        playerY -= playerVy;
        playerVy = -0.18 * ~~keys.includes(" ");
        if (collide()) {window.location.reload();}
    }

    c.fillStyle = "#ffff22";
    const w = 400 / (50.25 - playerX);
    //const t = -playerY / (100 - playerX) * 400;
    //const vw = 400 * 10 / (100 - playerX);
    c.fillRect(200 - w/2, 0, w, 400);
    for (let y = 0; y < 400; y++) {
        const w = raycast(Math.PI/2*y/400-Math.PI/4);
        c.fillStyle = w[1] ? "#222288" : "#444488";
        c.fillRect(200 - w[0] / 2, y, w[0], 1);
    }

    c.fillStyle = "red";
    for (let x = 0; x < 50; x++) {
        for (let y = 0; y < 10; y++) {
            if (map[x * 10 + y]) {
                c.fillRect(x*4, y*4+16, 4, 4);
            }
        }
    }

    c.fillStyle = "black";
    c.fillRect(playerX*4-1, playerY*4-2+16, 2, 2);

    if (playerY > 10) window.location.reload();
    if (playerX > 50) {
        playerX = 1;
        playerY = -2;
        playerVy = 0;
        genMap();
        const l = document.getElementById("l");
        l.innerHTML = l.innerHTML - 0 + 1;
    }
}, 40);
        </script>
    </body>
</html>
