<!DOCTYPE html>
<html>
    <body>
        <h1 id="l">0</h1>
        <canvas id="c" width="400" height="400"></canvas>
        <br/>
        Space to jump<br/>
        M to mute
        <script>
let keys = [];
const c = document.getElementById("c").getContext("2d");
const music_str = "n0,71|f12,71|n12,69|f12,69|n0,67|n12,64|f0,67|f12,64|n25,62|n12,64|f0,62|f12,64|n0,64|n12,62|f0,64|f12,62|n0,64|f12,64|n50,71|f12,71|n12,69|n12,67|f0,69|f12,67|n0,67|f12,67|n25,64|f12,64|n0,62|n12,62|f0,62|f12,62|n0,64|n12,62|f0,64|f12,62|n50,71|n12,59|f0,71|f12,59|n0,69|n12,67|f0,69|f12,67|n0,55|n12,64|f0,55|f12,64|n12,62|n0,50|n12,64|f0,62|f0,50|f12,64|n0,64|n0,52|n12,62|f0,64|f0,52|f12,62|n0,64|n0,52|f12,64|f0,52|n50,71|n12,59|f0,71|f12,59|n0,69|n12,67|f0,69|f12,67|n0,67|n12,55|f0,67|f12,55|n12,64|n0,52|n12,62|f0,64|f0,52|f12,62|n0,62|n0,50|n12,64|f0,62|f0,50|f12,64|n0,62|n0,50|f12,62|f0,50|n50,60|n12,59|f0,60|f12,59|n0,62|f12,62|n12,64|n12,55|f0,64|f12,55|n12,67|n0,50|n12,67|f0,67|f0,50|f12,67|n0,64|n12,67|f0,64|n0,50|f12,67|f0,50|n0,52|f12,52|n50,60|f12,60|n0,59|n12,62|f0,59|f12,62|n12,64|n12,55|f0,64|f12,55|n12,52|n0,67|n12,67|f0,52|f0,67|f12,67|n0,64|n12,52|n0,60|f0,64|f12,52|f0,60|n0,50|f12,50|n12,71|n12,69|f0,71|f12,69|n0,67|f12,67";
const music = music_str.split("|").map(x => [x[0], x.slice(1).split(",")[0], x.slice(1).split(",")[1]]);
let sound = true;
const m = Math;
const audio = new (window.AudioContext || window.webkitAudioContext)();
async function tone(note,time) {
    const f = 440 * m.pow(2, (note - 69) / 12);
    const osc = audio.createOscillator();
    const gn = audio.createGain();
    osc.type="square";
    osc.frequency.value=f;
    osc.connect(gn);
    gn.connect(audio.destination);
    osc.start();
    osc.stop(audio.currentTime + time / 1000);
}
async function wait(time) {
    return new Promise(r=>setTimeout(r,time));
}
async function playmusic() {
    while (true) {
        for (let i of music) {
            await wait(i[1]*10);
            if (i[0] == "n" && sound) {
                tone(i[2], 125);
            }
        }
    }
}
playmusic();

let map;
function genMap() {
    map = new Array(50*10).fill(0);
    let y = 0;
    for (let x = 0; x < 50; 0) {
        const l = x == 0 ? 6 : m.floor(m.random()*2) + 3;
        for (let i = 0; i < l && i+x < 50; i++) {
            map[(x+i)*10+y] = 1;
        }
        x += l + 2;
        y = m.min(9, m.max(0, y + m.floor(m.random()*4) - 1));
    }
}
genMap();
document.addEventListener("keydown", e => {
    keys.push(e.key);
    if (e.key == "m") sound=!sound;
});
document.addEventListener("keyup", e => {
    keys = keys.filter(x => x !== e.key);
});
let playX = 1, playY = -2, playVy = 0;
function raycast(angle) {
    for (let i = 1; i < 1000; i++) {
        const z = m.cos(angle)*0.03*i;
        const fx = playX + z;
        const x = m.floor(fx);
        const fy = playY + m.sin(angle)*0.03*i - 0.5;
        const y = m.floor(fy);
        if (map[10 * x + y] && fy > 0.05) return [400 / z, m.abs(m.round(fx)-fx) < 0.1];
        if (x < 0 || x > 49 || fy < -4.95 || fy > 9.95) break;
    }
    return [0, false];
}
function collide() {
    return map[10 * m.floor(playX) + m.floor(playY)] && playY > 0.05 && playY < 9.95;
}
setInterval(() => {
    c.fillStyle = "#3366ff";
    c.fillRect(0, 0, 400, 400);

    playX += 0.12;
    playVy += 0.01;
    playY += playVy;

    if (collide()) {
        playY -= playVy;
        playVy = -0.18 * ~~keys.includes(" ");
        if (collide()) {window.location.reload();}
    }

    c.fillStyle = "#ffff22";
    const w = 400 / (50.25 - playX);
    //const t = -playY / (100 - playX) * 400;
    //const vw = 400 * 10 / (100 - playX);
    c.fillRect(200 - w/2, 0, w, 400);
    for (let y = 0; y < 400; y++) {
        const w = raycast(m.PI/2*y/400-m.PI/4);
        c.fillStyle = w[1] ? "#222288" : "#444488";
        c.fillRect(200 - w[0] / 2, y, w[0], 1);
    }

    c.fillStyle = "red";
    for (let x = 0; x < 50; x++) {
        for (let y = 0; y < 10; y++) {
            if (map[x * 10 + y]) {
                c.fillRect(x*4, y*4+16, 4, 4);
            }
        }
    }

    c.fillStyle = "black";
    c.fillRect(playX*4-1, playY*4-2+16, 2, 2);

    if (playY > 10) window.location.reload();
    if (playX > 50) {
        playX = 1;
        playY = -2;
        playVy = 0;
        genMap();
        const l = document.getElementById("l");
        l.innerHTML = l.innerHTML - 0 + 1;
    }
}, 40);
        </script>
    </body>
</html>
